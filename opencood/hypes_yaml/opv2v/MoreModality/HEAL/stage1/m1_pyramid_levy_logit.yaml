# HEAL stage1 m1 (LiDAR) collaboration base, trained with LevyPyramidFusion in
# 'logit' score_mode.
#
# Identical to m1_pyramid.yaml in every respect except the `levy:` block under
# model.args.fusion_backbone -- so it is a clean ablation against the HEAL baseline.
#
# Why this needs its own stage-1 run: 'logit' feeds the raw foreground logits to the
# intensity lambda_j = tau * exp(gamma * S_j) instead of HEAL's sigmoid(occ)+1e-4.
# That changes the fusion weights themselves, not just the diagnostic, so the
# collaboration base has to be trained under the operator it will be used with.
# (score_mode 'heal' with gamma=1 reproduces PyramidFusion exactly and needs no
# retraining at all -- use plain m1_pyramid.yaml for that.)
#
#   python opencood/tools/train.py --hypes_yaml \
#       opencood/hypes_yaml/opv2v/MoreModality/HEAL/stage1/m1_pyramid_levy_logit.yaml
#
# Optional warm start from an existing HEAL m1 base (load_saved_model uses
# strict=False and the state_dict keys are identical, so nothing is missing):
#   mkdir -p opencood/logs/Pyramid_m1_base_levy_logit
#   cp opencood/logs/<your_m1_base>/net_epoch_bestval_at*.pth \
#      opencood/logs/Pyramid_m1_base_levy_logit/net_epoch1.pth
#   python opencood/tools/train.py --hypes_yaml <this file> \
#       --model_dir opencood/logs/Pyramid_m1_base_levy_logit

name: Pyramid_m1_base_levy_logit
root_dir: "dataset/OPV2V/train"
validate_dir: "dataset/OPV2V/validate"
test_dir: "dataset/OPV2V/test"

yaml_parser: "load_general_params"
train_params:
  batch_size: &batch_size 2
  epoches: 25
  eval_freq: 2
  save_freq: 2
  max_cav: 5

comm_range: 70
input_source: ['lidar']
label_type: 'lidar'
cav_lidar_range: &cav_lidar [-102.4, -51.2, -3, 102.4, 51.2, 1]


heter:
  assignment_path: "opencood/logs/heter_modality_assign/opv2v_4modality.json" 
  ego_modality: &ego_modality "m1"
  mapping_dict:
    m1: m1
    m2: m1
    m3: m1
    m4: m1
  modality_setting:
    m1:
      sensor_type: &sensor_type_m1 'lidar'
      core_method: &core_method_m1 "point_pillar"

      # lidar requires preprocess
      preprocess:
        # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
        core_method: 'SpVoxelPreprocessor'
        args:
          voxel_size: &voxel_size [0.4, 0.4, 4]
          max_points_per_voxel: 32
          max_voxel_train: 32000
          max_voxel_test: 70000
        # lidar range for each individual cav.
        cav_lidar_range: *cav_lidar


fusion:
  core_method: 'intermediateheter'
  dataset: 'opv2v'
  args: 
    proj_first: false
    grid_conf: None # place-holder
    data_aug_conf: None # place-holder


preprocess:
  # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: [0.4, 0.4, 4] # useful
    max_points_per_voxel: 1 # useless
    max_voxel_train: 1 # useless
    max_voxel_test: 1 # useless
  # lidar range for each individual cav.
  cav_lidar_range: *cav_lidar

# anchor box related
postprocess:
  core_method: 'VoxelPostprocessor' # VoxelPostprocessor, BevPostprocessor supported
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: &anchor_yaw [0, 90]
    feature_stride: 2
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: 'hwl' # hwl or lwh
  max_num: 150 # maximum number of objects in a single frame. use this number to make sure different frames has the same dimension in the same batch
  nms_thresh: 0.15
  dir_args: &dir_args
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *anchor_yaw

# model related
model:
  core_method: heter_pyramid_collab
  args:
    lidar_range: *cav_lidar
    supervise_single: true
    m1:
      core_method: *core_method_m1
      sensor_type: *sensor_type_m1

      encoder_args:
        voxel_size: *voxel_size
        lidar_range: *cav_lidar
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64

      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
  
      aligner_args:
        core_method: identity


    fusion_backbone: 
      resnext: true
      layer_nums: [3, 5, 8]
      layer_strides: [1, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
      anchor_number: *anchor_num

      # ---- Levy spatial pyramid fusion -------------------------------------
      # Adds no parameters: the state_dict is identical to PyramidFusion's.
      levy:
        # Raw foreground logits drive the intensity, so evidence Lambda spans
        # orders of magnitude instead of HEAL's narrow [tau*N, tau*N*e] band.
        score_mode: logit

        # Base Poisson rate. Cancels out of the fusion weights; it only sets where
        # Lambda lands on phi(Lambda), which peaks at Lambda ~ 1.5.
        rate_tau: 0.5

        # Logit temperature. THE parameter to tune -- see notes at the bottom.
        # 0.25 keeps fusion sharper than HEAL (max weight ratio ~e^(0.25*range))
        # without collapsing to hard selection, and keeps Lambda inside the
        # informative part of phi. Do NOT use 1.0 here: see notes.
        temp_gamma: 0.25

        # Channel reduction for tr Sigma. 'sum' is the blueprint definition;
        # deeper levels then carry larger values (64/128/256 channels), which the
        # scale weights below rebalance. 'mean' removes that dependence instead.
        disagreement_reduction: sum

        # omega_l for aggregating the per-level sigma into one BEV trust map.
        # Tied to the pyramid foreground loss weights below (blueprint Sec. 5.2);
        # normalised internally. Use [1, 1, 1] for a plain average.
        scale_weights: [0.4, 0.2, 0.1]

        # Keep the trust map out of the autograd graph. It is a diagnostic and
        # must not perturb detection gradients.
        detach_uncertainty: true
        compute_uncertainty: true

        # Alternative trust-map parameterisations, computed alongside the base map
        # in the same forward pass and exposed under levy_uncertainty['variants'].
        # Diagnostic only: the fused feature -- and so every detection output --
        # is untouched, so these need no retraining.
        #
        #   disagreement_mode 'cosine' computes tr Sigma on L2-normalised features,
        #   measuring pure angular conflict between agents instead of letting the
        #   feature magnitude ||F_j|| dominate. It reduces to 1 - ||sum_j p_j
        #   F_hat_j||^2 and is bounded in [0, 1], so a near-zero background feature
        #   no longer reads as agreement just for being short.
        #
        #   shift adds an offset to the logits before exponentiation:
        #   lambda_j = tau * exp(gamma * (S_j + shift)). Measured foreground logits
        #   sit near S ~ -5, which leaves Lambda ~ 0.34 -- far below the ~1.5 where
        #   phi(Lambda) and the (1 - exp(-Lambda)) gate carry information. shift 6.0
        #   at gamma 0.25 (or 5.2 at gamma 1.0) recentres Lambda on ~1.5.
        uncertainty_variants:
          - name: cos            # angular conflict, intensity as trained
            gamma: 0.25
            shift: 0.0
            disagreement_mode: cosine
          - name: cos_shift      # angular conflict + Lambda recentred
            gamma: 0.25
            shift: 6.0
            disagreement_mode: cosine
          - name: raw_shift      # isolates the shift: blueprint tr Sigma, Lambda recentred
            gamma: 0.25
            shift: 6.0
            disagreement_mode: raw
          - name: g1_shift       # sharper intensity, Lambda recentred
            gamma: 1.0
            shift: 5.2
            disagreement_mode: raw
          - name: cos_g1_shift   # both changes together
            gamma: 1.0
            shift: 5.2
            disagreement_mode: cosine

        # sigma -> physical error scale, fitted post-hoc on the val split against
        # CRPS (blueprint Sec. 5.3). Identity until you fit it.
        # Fit with:  python opencood/tools/calibrate_levy.py --model_dir <dir> --write_yaml
        calibration:
          a: 1.0
          b: 0.0

        # Sparsification Filter (blueprint Sec. 8). Read at inference time only;
        # CLI flags of inference.py override these.
        #
        # MEASURED VERDICT: leave this off. Benchmarked at every threshold, on
        # both the raw and the cosine channels, at five noise levels: dropping
        # never pays. It always lowers the FP rate -- it removes more false than
        # true positives -- but AP falls faster, because the true positives it
        # takes cost recall that the precision gain never repays. Prefer the
        # re-scoring rule below, which re-ranks instead of discarding and so
        # never sacrifices recall.
        #
        # NOTE the thresholds here are on the OLD score_mode 'heal' scale, where
        # sigma_hat had p50 ~ 0.28. Under score_mode 'logit' sigma_hat p50 is
        # ~2.14, so 0.20 flags almost nothing. Re-measure before using.
        sparsify:
          enable: false
          sigma_threshold: 0.20
          # Which side of the threshold to flag. Pick it from the error
          # diagnostic (inference.py --levy_diag), never by assumption:
          # 'low'  -> flag sigma_hat < threshold. Correct for an INVERTED
          #           channel, i.e. AUROC(sigma->FP) < 0.5, which is what the
          #           raw sigma_hat is on this checkpoint (~0.20).
          # 'high' -> flag sigma_hat > threshold (original blueprint behaviour).
          #           Correct for the cosine channels, whose AUROC is > 0.5.
          direction: low
          mode: attenuate      # 'attenuate' (score *= attenuation) | 'drop'
          attenuation: 0.5
          reduce: mean         # 'mean' | 'max' | 'center' over the box footprint
          channel: sigma       # 'sigma' (raw sigma_hat) | 'sigma_calibrated'

        # Upstream pre-transmission gateway (blueprint Sec. 5). Unlike every
        # option above -- which post-processes detection scores and leaves the
        # network untouched -- this multiplies each agent's OWN BEV features by
        # (1 - exp(-Lambda_local))^k before they are warped into the ego frame,
        # so it changes what the backbone and heads see. Read at both train and
        # inference time; inference.py's --levy_gateway* flags override it.
        #
        # Calibration is the whole game and does not transfer between score
        # modes (tau = 0.5):
        #   score_mode heal,  gamma 4.0, S in (0,1]  ->  Lambda in [0.5, 27.3]
        #                                                gate in [0.63, 1.00]
        #   score_mode logit, gamma 0.25, S ~ -5     ->  Lambda ~ 0.14
        #                                                gate ~ 0.13 EVERYWHERE
        # The second row is not a filter, it is a global rescale of the feature
        # map that a frozen checkpoint's BatchNorm statistics have never seen.
        # gate_ref fixes that: it renormalises the gate to 1 at a reference
        # score, so only cells BELOW the reference are attenuated. Set it
        # whenever Lambda's dynamic range does not already straddle 1.
        gateway:
          enable: false
          gate_power: 0.5          # k; 0 is the identity
          temp_gamma: 0.25         # defaults to 4.0 (heal) / 0.25 (logit)
          rate_tau: 0.5
          score_mode: null         # defaults to the fusion's own score_mode
          gate_ref: null           # null = the literal blueprint gate
          pruning_threshold: 0.6   # Theta for the reported transmission mask
          hard_prune: false        # true actually zeroes cells outside the mask
          levels: null             # null = all pyramid levels; e.g. [0]

    shrink_header:
      kernal_size: [ 3 ]
      stride: [ 1 ]
      padding: [ 1 ]
      dim: [ 256 ]
      input_dim: 384 # 128 * 3

    in_head: 256
    anchor_number: *anchor_num
    dir_args: *dir_args


loss:
  core_method: point_pillar_pyramid_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: 'SigmoidFocalLoss'
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: 'WeightedSmoothL1Loss'
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: 'WeightedSoftmaxClassificationLoss'
      weight: 0.2
      args: *dir_args
    depth:
      weight: 1.0
    pyramid:
      relative_downsample: [1, 2, 4]
      weight: [0.4, 0.2, 0.1]


optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep #step, multistep and Exponential support
  gamma: 0.1
  step_size: [15, 25]

