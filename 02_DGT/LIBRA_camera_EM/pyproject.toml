[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-recognition"
version = "0.0.1"
description = "Training pipeline for emotion recognition models"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "timm==1.0.26",
    "pandas==2.3.3",
    "tqdm==4.67.3",
    "matplotlib==3.10.7",
    "pydantic==2.12.5",
    "mlflow==3.3.2",
    "psutil==7.1.3",
    "scikit-learn>=1.4",
]

[project.scripts]
train = "emotion_recognition.train:main"
test  = "emotion_recognition.evaluate:main"

[project.optional-dependencies]
dev = [
    "ipykernel==7.1.0",
    "ruff==0.14.6",
    "ty==0.0.12",
    "pytest==9.0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["emotion_recognition*"]

[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "migrations/*",
    "tests/fixtures/*",
    "*.ipynb",
]
[tool.ty.environment]
root = ["./emotion_recognition"]

[tool.ty.src]
exclude = ["notebooks/*"]

[tool.ty.rules]
possibly-missing-attribute = "ignore"