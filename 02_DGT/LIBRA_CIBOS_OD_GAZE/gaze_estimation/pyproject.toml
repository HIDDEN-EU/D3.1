[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaze-estimation"
version = "0.1.0"
description = "Generic face-crop Vision Transformer that regresses a 2D gaze point (HIDDEN D3.1, DGT)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.2",
    "timm>=1.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
export = ["onnx>=1.16"]
dev = ["pytest>=7.0", "onnx>=1.16"]

[project.scripts]
gaze-train = "gaze_estimation.train:main"
gaze-evaluate = "gaze_estimation.evaluate:main"
gaze-export-onnx = "gaze_estimation.export_onnx:main"

[tool.setuptools.packages.find]
include = ["gaze_estimation*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
